<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoonApp — макет интерфейса (Material 3)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<style>
/* ---------- Material 3 tokens: тёмная схема + выбор акцента ---------- */
:root{
  --primary:#ffb951; --on-primary:#472a00; --primary-container:#654000; --on-primary-container:#ffddb0;
  --secondary-container:#3f3626; --on-secondary-container:#f1e0c4;
  --surface:#15130f; --surface-1:#1d1a15; --surface-2:#221f19; --surface-3:#292520; --surface-4:#2f2a24;
  --on-surface:#e9e1d8; --on-surface-variant:#cfc5b4; --outline:#988f80; --outline-variant:#4d463a;
  --good:#7ddca0; --bad:#ffb4ab; --warn:#ffd36e;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-xl:28px;
  --scale:1;
}
:root[data-accent="violet"]{--primary:#d0bcff;--on-primary:#381e72;--primary-container:#4f378b;--on-primary-container:#eaddff;--secondary-container:#33304a;--on-secondary-container:#e1dcf5;--surface:#141218;--surface-1:#1c1a21;--surface-2:#211f26;--surface-3:#2b2930;--surface-4:#312f38;--outline-variant:#49454f}
:root[data-accent="teal"]{--primary:#4fd8c4;--on-primary:#003730;--primary-container:#005046;--on-primary-container:#6ff7e0;--secondary-container:#1f3a37;--on-secondary-container:#cce8e3;--surface:#0e1514;--surface-1:#161d1c;--surface-2:#1a2120;--surface-3:#252b2a;--surface-4:#2b3231;--outline-variant:#3f4947}
:root[data-accent="coral"]{--primary:#ffb4a8;--on-primary:#561e17;--primary-container:#73342b;--on-primary-container:#ffdad4;--secondary-container:#4a2b27;--on-secondary-container:#ffdad4;--surface:#18110f;--surface-1:#201714;--surface-2:#261b18;--surface-3:#312622;--surface-4:#382c28;--outline-variant:#534340}
:root[data-theme="light"]{--primary:#8a5100;--on-primary:#fff;--primary-container:#ffddb0;--on-primary-container:#2c1600;--secondary-container:#f7e0bd;--on-secondary-container:#261a04;--surface:#fff8f3;--surface-1:#f8efe4;--surface-2:#f3e9dc;--surface-3:#eee3d4;--surface-4:#e8dccb;--on-surface:#1f1b13;--on-surface-variant:#4e4639;--outline:#7f7667;--outline-variant:#d1c5b4;--good:#1b7a45;--bad:#ba1a1a;--warn:#8a6100}
*{box-sizing:border-box}
html{zoom:var(--scale)}
body{margin:0;background:var(--surface);color:var(--on-surface);font:400 14px/1.45 "Roboto Flex",system-ui,sans-serif;height:100vh;overflow:hidden}
.ms{font-family:"Material Symbols Rounded";font-weight:400;font-style:normal;font-size:22px;line-height:1;display:inline-block;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:"liga";font-feature-settings:"liga";vertical-align:middle;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:auto 1fr;grid-template-rows:64px 1fr;height:100vh}
.topbar{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--outline-variant)}
.topbar .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px;min-width:200px}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--primary-container));display:grid;place-items:center;color:var(--on-primary)}
.search{flex:1;max-width:560px;display:flex;align-items:center;gap:10px;background:var(--surface-3);border-radius:999px;padding:0 16px;height:44px;color:var(--on-surface-variant);border:0}
.search{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.search kbd{margin-left:auto;font:500 11px "Roboto Mono",monospace;padding:2px 6px;border-radius:6px;background:var(--surface-1);border:1px solid var(--outline-variant)}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--on-surface-variant);position:relative}
.icon-btn:hover{background:color-mix(in srgb,var(--on-surface) 10%,transparent)}
.icon-btn.on{background:var(--secondary-container);color:var(--on-secondary-container)}
.dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--good)}
.tag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--outline-variant);background:transparent;color:var(--on-surface-variant);font-size:13px}
/* навигация: сгруппированный drawer, сворачивается в rail */
.nav{width:280px;background:var(--surface-1);padding:12px;overflow-y:auto;transition:width .2s;border-right:1px solid var(--outline-variant)}
.app.rail .nav{width:80px}
.app.rail .nav .lbl,.app.rail .nav .grp{display:none}
.nav .grp{font:500 12px "Roboto Flex";letter-spacing:.06em;text-transform:uppercase;color:var(--on-surface-variant);padding:16px 16px 6px}
.nav-item{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-radius:999px;border:0;background:transparent;width:100%;text-align:left;color:var(--on-surface-variant)}
.nav-item:hover{background:color-mix(in srgb,var(--on-surface) 8%,transparent)}
.nav-item.active{background:var(--secondary-container);color:var(--on-secondary-container);font-weight:600}
.nav-item .badge{margin-left:auto;font-size:11px;padding:2px 8px;border-radius:999px;background:var(--primary-container);color:var(--on-primary-container)}
.app.rail .nav .nav-item{justify-content:center;padding:0}
.app.rail .nav .nav-item .badge{display:none}
/* контент */
.main{overflow-y:auto;overflow-x:hidden;padding:24px 32px 48px;min-width:0}
@media (max-width:700px){.main{padding:16px}.topbar .brand span:last-child{display:none}.search{display:none}}
.page{max-width:1280px;margin:0 auto}
h1{font:500 28px/36px "Roboto Flex";margin:0}
.sub{color:var(--on-surface-variant);margin:2px 0 20px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.head .spacer{flex:1}
/* вкладки M3 (primary tabs) */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--outline-variant);margin:8px 0 20px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;height:48px;padding:0 20px;background:transparent;border:0;border-bottom:3px solid transparent;color:var(--on-surface-variant);font-weight:500;white-space:nowrap}
.tab:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
/* карточки */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--surface-2);border-radius:var(--r-l);padding:20px}
.card.out{background:transparent;border:1px solid var(--outline-variant)}
.card h3{margin:0 0 4px;font:500 16px "Roboto Flex"}
.card .hint{color:var(--on-surface-variant);font-size:13px}
.metric{display:flex;flex-direction:column;gap:2px;position:relative}
.metric .v{font:500 32px/40px "Roboto Flex"}
.metric .l{color:var(--on-surface-variant);font-size:13px}
.metric .ms{position:absolute;right:0;top:0;color:var(--primary)}
.bar{height:8px;border-radius:999px;background:var(--surface-4);overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:inherit;transition:width .4s}
.bar.good>i{background:var(--good)} .bar.bad>i{background:var(--bad)}
/* кнопки */
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 24px;border-radius:999px;border:0;font-weight:500;background:var(--primary);color:var(--on-primary)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outline{background:transparent;color:var(--primary);border:1px solid var(--outline)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn.sm{height:32px;padding:0 16px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.fab{position:fixed;right:32px;bottom:32px;height:56px;padding:0 20px;border-radius:var(--r-l);border:0;background:var(--primary-container);color:var(--on-primary-container);display:flex;align-items:center;gap:12px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:var(--r-s);border:1px solid var(--outline);background:transparent;color:var(--on-surface-variant);font-size:13px}
.chip.sel{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chip.good{border-color:var(--good);color:var(--good)} .chip.bad{border-color:var(--bad);color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:999px;overflow:hidden}
.seg button{height:40px;padding:0 18px;border:0;background:transparent;border-right:1px solid var(--outline);color:var(--on-surface)}
.seg button:last-child{border-right:0}
.seg button.sel{background:var(--secondary-container);color:var(--on-secondary-container)}
/* списки */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:16px;padding:12px 8px;border-bottom:1px solid var(--outline-variant);min-height:64px}
.li:last-child{border-bottom:0}
.li .lead{width:40px;height:40px;border-radius:50%;background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;flex-shrink:0}
.li .t{font-weight:500}.li .s{font-size:13px;color:var(--on-surface-variant)}
.li .end{margin-left:auto;display:flex;gap:8px;align-items:center}
.li.click{cursor:pointer;border-radius:var(--r-m)} .li.click:hover{background:color-mix(in srgb,var(--on-surface) 6%,transparent)}
/* переключатель */
.switch{position:relative;width:52px;height:32px;border-radius:999px;border:2px solid var(--outline);background:var(--surface-4);flex-shrink:0;padding:0}
.switch::after{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--outline);transition:.15s}
.switch.on{background:var(--primary);border-color:var(--primary)}
.switch.on::after{left:26px;top:2px;width:24px;height:24px;background:var(--on-primary);top:2px}
.switch.on::after{top:2px;left:22px}
input[type=range]{width:100%;accent-color:var(--primary)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{background:var(--surface-3);border:0;border-bottom:2px solid var(--outline);border-radius:var(--r-s) var(--r-s) 0 0;padding:12px;color:var(--on-surface);font:inherit;outline:0}
.field input:focus,.field textarea:focus{border-bottom-color:var(--primary)}
.field label{font-size:12px;color:var(--on-surface-variant)}
/* master-detail «ИИ и модели» */
.md{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:16px;align-items:start}
@media (max-width:900px){.md{grid-template-columns:1fr}}
.md .nav-item{height:auto;min-height:64px;padding:10px 16px;border-radius:var(--r-l)}
.md .nav-item small{display:block;color:var(--on-surface-variant);font-weight:400}
.st{width:10px;height:10px;border-radius:50%;background:var(--bad);flex-shrink:0}.st.ok{background:var(--good)}
/* боковая панель (side sheet) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--surface-1);border-radius:var(--r-xl) 0 0 var(--r-xl);transform:translateX(105%);transition:transform .25s;z-index:21;display:flex;flex-direction:column;padding:24px;gap:16px;overflow:auto}
.sheet.show{transform:none}
.sheet h2{margin:0;font:500 22px "Roboto Flex"}
/* график */
canvas{width:100%;height:160px;display:block}
.cores{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.core{background:var(--surface-3);border-radius:var(--r-m);padding:10px 12px;font-size:12px;color:var(--on-surface-variant)}
.core b{display:block;font:500 18px "Roboto Flex";color:var(--on-surface)}
.snack{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--on-surface);color:var(--surface);padding:14px 20px;border-radius:var(--r-s);transition:.25s;z-index:30}
.snack.show{transform:translateX(-50%)}
.banner{display:flex;gap:12px;align-items:center;background:var(--primary-container);color:var(--on-primary-container);border-radius:var(--r-l);padding:12px 16px;margin-bottom:16px}
.note{font-size:12px;color:var(--on-surface-variant)}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn" id="railBtn" title="Свернуть меню"><span class="ms">menu</span></button>
    <div class="brand"><span class="logo"><span class="ms">dark_mode</span></span>MoonApp</div>
    <button class="search" id="cmdk"><span class="ms">search</span>Поиск по приложению, командам и файлам<kbd>Ctrl K</kbd></button>
    <div class="spacer"></div>
    <button class="icon-btn" id="ctxBtn" title="Контекст (подсказки)"><span class="ms">tips_and_updates</span><span class="dot"></span></button>
    <button class="icon-btn" title="Машина времени"><span class="ms">history</span></button>
    <button class="icon-btn" title="Диспетчер задач"><span class="ms">monitoring</span></button>
    <button class="icon-btn" id="themeBtn" title="Тема"><span class="ms">contrast</span></button>
  </header>
  <nav class="nav" id="nav"></nav>
  <main class="main"><div class="page" id="page"></div></main>
</div>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet"></aside>
<div class="snack" id="snack"></div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const ic=n=>`<span class="ms">${n}</span>`;
/* ---------- навигация: 5 групп вместо 25 одинаковых иконок ---------- */
const NAV=[
 {g:"Главное",items:[["home","Обзор","home"]]},
 {g:"ИИ",items:[["models","Модели и ИИ","neurology","единое место"],["chat","ИИ-чат","chat"],["voice","Озвучка","record_voice_over"],["lecture","Лекторий","school"],["translate","Переводчик","translate"],["upscale","Апскейл","auto_fix_high"]]},
 {g:"Знания",items:[["tasks","Задачи и заметки","task_alt"],["diary","Дневник","book_2"],["rss","RSS","rss_feed"],["books","Книги","menu_book"]]},
 {g:"Медиа",items:[["movies","Кино","movie"],["music","Музыка","music_note"],["video","Видео","videocam"],["convert","Конвертер","autorenew"],["compress","Сжатие","compress"],["shots","Скриншоты","screenshot_monitor"]]},
 {g:"Система",items:[["monitor","Мониторинг","monitoring"],["bypass","Обход блокировок","shield"],["auto","Автоматизация","bolt"],["games","Игры","sports_esports"],["budget","Бюджет","account_balance_wallet"],["archive","Архив","inventory_2"],["tools","Инструменты","build"]]},
 {g:"",items:[["settings","Настройки","settings"]]}
];
const TITLES={};NAV.forEach(s=>s.items.forEach(i=>TITLES[i[0]]=i));
function renderNav(cur){
  $("#nav").innerHTML=NAV.map(s=>(s.g?`<div class="grp">${s.g}</div>`:"")+s.items.map(i=>
    `<button class="nav-item ${i[0]===cur?"active":""}" data-p="${i[0]}" title="${i[1]}">${ic(i[2])}<span class="lbl">${i[1]}</span>${i[3]?`<span class="badge lbl">${i[3]}</span>`:""}</button>`).join("")).join("");
  $$(".nav-item").forEach(b=>b.onclick=()=>go(b.dataset.p));
}
/* ---------- утилиты UI ---------- */
function tabs(list,cur,id){return `<div class="tabs" data-tabs="${id}">`+list.map(t=>`<button class="tab ${t[0]===cur?"active":""}" data-t="${t[0]}">${ic(t[2])}${t[1]}</button>`).join("")+`</div>`}
function snack(t){const s=$("#snack");s.textContent=t;s.classList.add("show");clearTimeout(snack.t);snack.t=setTimeout(()=>s.classList.remove("show"),2200)}
function openSheet(html){$("#sheet").innerHTML=html;$("#sheet").classList.add("show");$("#scrim").classList.add("show")}
function closeSheet(){$("#sheet").classList.remove("show");$("#scrim").classList.remove("show")}
$("#scrim").onclick=closeSheet;
const state={page:"home",tab:{}};
function header(t,s,actions=""){return `<div class="head"><div><h1>${t}</h1><p class="sub" style="margin:0">${s}</p></div><div class="spacer"></div>${actions}</div>`}
function mount(html,after){$("#page").innerHTML=html;$$("[data-tabs]").forEach(el=>{$$(".tab",el).forEach(b=>b.onclick=()=>{state.tab[state.page]=b.dataset.t;go(state.page,true)})});after&&after()}
const curTab=(d)=>state.tab[state.page]||d;
let timers=[];
function go(p,keep){state.page=p;timers.forEach(clearInterval);timers=[];renderNav(p);(PAGES[p]||generic)(p);if(!keep)$("#page").parentElement.scrollTop=0}

/* ---------- страницы ---------- */
const PAGES={};
PAGES.home=()=>mount(`
 ${header("Добрый вечер, Moon","Всё локально, в одном окне. Ниже — что сейчас важно.")}
 <div class="grid g4" style="margin-bottom:24px">
  <div class="card metric">${ic("memory")}<span class="v">28%</span><span class="l">Процессор · 12 потоков</span><div class="bar"><i style="width:28%"></i></div></div>
  <div class="card metric">${ic("thermostat")}<span class="v">39°C</span><span class="l">Температура GPU</span><div class="bar good"><i style="width:39%"></i></div></div>
  <div class="card metric">${ic("developer_board")}<span class="v">43%</span><span class="l">Память · 13.6 / 32 ГБ</span><div class="bar"><i style="width:43%"></i></div></div>
  <div class="card metric">${ic("hard_drive")}<span class="v">62%</span><span class="l">Диск C: занят</span><div class="bar"><i style="width:62%"></i></div></div>
 </div>
 <h3 style="margin:0 0 12px">Быстрые действия</h3>
 <div class="grid g3" style="margin-bottom:24px">
  ${[["models","neurology","Установить модель ИИ","Whisper, озвучка, перевод — в одном месте"],["tasks","add_task","Новая задача","Быстрый ввод: «встреча завтра 15:00 !high»"],["lecture","mic","Записать лекцию","Распознавание + конспект ИИ"],["monitor","monitoring","Состояние ПК","Датчики, диски, дубликаты"],["upscale","auto_fix_high","Улучшить фото/видео","ONNX-модели, GPU"],["bypass","shield","Обход блокировок","zapret + прокси Telegram"]].map(a=>
   `<button class="card out" style="text-align:left;display:flex;gap:16px;align-items:center" onclick="go('${a[0]}')"><span class="li"><span class="lead">${ic(a[1])}</span></span><span><div class="t" style="font-weight:600">${a[2]}</div><div class="hint">${a[3]}</div></span></button>`).join("")}
 </div>
 <div class="card"><h3>ИИ и модели</h3><p class="hint">Что установлено и работает</p>
  <div class="chips"><span class="chip bad">${ic("error")} Whisper не установлен</span><span class="chip good">${ic("check_circle")} Озвучка F5-TTS</span><span class="chip bad">Переводчик не установлен</span><span class="chip">Умный поиск выключен</span></div>
  <p style="margin:16px 0 0"><button class="btn tonal" onclick="go('models')">${ic("neurology")}Открыть управление моделями</button></p></div>`);

PAGES.monitor=()=>{
 const t=curTab("live");
 let body="";
 if(t==="live")body=`
  <div class="grid g4" style="margin-bottom:16px">
   <div class="card metric">${ic("memory")}<span class="v" id="mCpu">28%</span><span class="l">CPU · 12 потоков</span></div>
   <div class="card metric">${ic("thermostat")}<span class="v">—</span><span class="l">Температура CPU</span></div>
   <div class="card metric">${ic("developer_board")}<span class="v" id="mGpu">17%</span><span class="l">RTX 5060 Ti</span></div>
   <div class="card metric">${ic("sdcard")}<span class="v">43%</span><span class="l">ОЗУ · 13.6/32 ГБ</span></div>
  </div>
  <div class="card" style="margin-bottom:16px"><h3>Загрузка CPU / GPU</h3><canvas id="chart" height="160"></canvas></div>
  <div class="card"><h3>Потоки</h3><div class="cores" id="cores"></div></div>`;
 if(t==="disk")body=`
  <div class="grid g2">
   <div class="card"><h3>Анализатор диска</h3><p class="hint">Карта занятого места с переходом по папкам</p>
    <div class="chips" style="margin:12px 0">${["C:\\","D:\\","E:\\"].map((d,i)=>`<span class="chip ${i?"":"sel"}">${ic("hard_drive")}${d}</span>`).join("")}</div>
    <div class="field"><label>Своя папка</label><input placeholder="D:\\Games"></div>
    <p style="margin:16px 0 0"><button class="btn">${ic("search")}Сканировать</button></p></div>
